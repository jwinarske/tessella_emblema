[package]
name = "tessella-emblema"
version = "0.0.0"
edition = "2024"
# The Rust in Yocto wrynose (6.0) oe-core, matching tessella. See rust-toolchain.toml.
rust-version = "1.94.1"
license = "BSD-2-Clause"
authors = ["Joel Winarske <joel.winarske@gmail.com>"]
repository = "https://github.com/jwinarske/tessella_emblema"
description = "The map pass of tessella's capture stream, drawn with Vulkan on emblema's device."

[dependencies]
# The port boundary. This crate's whole reason to exist is to consume what this describes, so it
# is a dependency from the first commit even where the consuming code is not written yet.
tessella-capture-abi = { path = "../tessella/crates/tessella-capture-abi" }

# The renderer-agnostic half: reading the ring, joining, collapsing, the stencil partition. Shared
# with every other consumer rather than written again here, which is what keeps two implementations
# evidence about the drawing rather than about the arithmetic.
tessella-consume = { path = "../tessella/crates/tessella-consume" }

# Loaded at run time through `libvulkan`, so no C toolchain at build -- the pure-Rust rule both
# neighboring trees hold to. Pinned to emblema's own `ash`, so a graph containing both has one.
ash = "0.38"

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Every Vulkan enum is a `u32` newtype and every size is a `usize`; the casts between them are
# the API's, not this crate's judgment to second-guess.
cast_possible_truncation = "allow"

[dev-dependencies]
naga = { version = "23", features = ["wgsl-in", "spv-out"] }
